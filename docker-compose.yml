services:
  sussy_ducky_bot:
    build: .
    container_name: sussy_ducky_bot
    restart: unless-stopped
    # Match the host user so ./data stays owned by you.
    user: "1000:1000"
    env_file: .env
    environment:
      - LLM_URL=http://host.docker.internal:8081
    volumes:
      - ./data:/data
      # Log timestamps in the host's time zone.
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
